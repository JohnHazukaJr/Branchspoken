<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Branch Spoken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">

  <header>
    <a class="back" href="index.html" aria-label="Back to welcome page">Back</a>
  </header>

  <main>

    <section aria-labelledby="login-heading">
      <p class="brand">Branch Spoken</p>
      <h1 id="login-heading">Welcome back.</h1>
      <p class="lead">Sign in to see what your family has added since your last visit.</p>

      <form method="post">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <div>
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Keep me signed in</label>
        </div>

        <button type="submit">Sign in</button>
      </form>
    </section>

    <p class="fine-print">New to Branch Spoken? <a href="signup.html">Plant your tree</a></p>
    <p class="fine-print">Got an invite from family? <a href="join.html">Join their tree</a></p>

  </main>

</body>
</html>
