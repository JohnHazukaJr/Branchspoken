<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Branch Spoken</title>
</head>
<body>

  <header>
    <a href="index.html" aria-label="Back to welcome page">Back</a>
  </header>

  <main>

    <section aria-labelledby="login-heading">
      <p>Branch Spoken</p>
      <h1 id="login-heading">Welcome back.</h1>
      <p>Sign in to see what your family has added since your last visit.</p>

      <form method="post">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <div>
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Keep me signed in</label>
        </div>

        <button type="submit">Sign in</button>
      </form>
    </section>

    <p>New to Branch Spoken? <a href="signup.html">Plant your tree</a></p>
    <p>Got an invite from family? <a href="join.html">Join their tree</a></p>

  </main>

</body>
</html>
